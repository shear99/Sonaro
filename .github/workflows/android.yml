name: Android Build

# FORK: run for pull requests and for main only. Upstream's `branches: []` also ran
# on every branch push, which builds each pull request twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# FORK: a newer push to the same pull request cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# FORK: the job only reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    # FORK: ninja, submodules and JDK moved to a shared action so that this
    # workflow and lint.yml cannot drift apart.
    - name: Set up build environment
      uses: ./.github/actions/setup-android-build
    # FORK: assembleDebug instead of packageDebug. It builds every debug variant,
    # so it keeps working when the foss/gms product flavors are added.
    - name: Build debug APK with Gradle
      run: ./gradlew :app:assembleDebug
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: Sonaro_Canary
        # FORK: glob, because flavors move the APKs into per-flavor directories.
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
