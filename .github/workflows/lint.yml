name: Android Lint

# FORK: same triggers, concurrency and permissions as android.yml (see there).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    # FORK: shared setup. Upstream set up JDK 17 here although the build needs 21.
    - name: Set up build environment
      uses: ./.github/actions/setup-android-build
    - name: Check formatting with spotless
      run: ./gradlew spotlessCheck
    # FORK: also runs the app's unit tests (upstream only tested musikr). ciUnitTest
    # comes from .github/ci.init.gradle and covers every debug variant.
    - name: Run unit tests
      run: ./gradlew --init-script .github/ci.init.gradle :app:ciUnitTest :musikr:ciUnitTest
    # FORK: Android lint was never run by upstream's CI. `lint` checks the default
    # variant (debug today, fossDebug once flavors exist).
    - name: Run Android lint
      run: ./gradlew :app:lint
    # FORK: keep the HTML reports when a check fails, to read without rerunning.
    - name: Upload reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          app/build/reports
          musikr/build/reports
        if-no-files-found: ignore
