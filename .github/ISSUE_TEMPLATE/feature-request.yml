name: Feature Request
description: Propose new functionality
labels: ["enhancement"]
# FORK: No default assignee (upstream assigns its own maintainer), Sonaro wording/links below, and
# no reference to Auxio's list of rejected features, which does not bind Sonaro.
body:
  - type: markdown
    attributes:
      value: |
        Welcome to Sonaro's feature request form.
        Sonaro is a fork of [Auxio](https://github.com/OxygenCobalt/Auxio). Please request Sonaro features here and not from the Auxio project.
  - type: textarea
    id: desc
    attributes:
      label: Description 
      description: Provide a clear and concise description of the feature to implement.
      placeholder: I want...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem solved
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
  - type: textarea
    id: others
    attributes:
      label: Other implementations
      description: How do other music players handle this? Please describe.
      placeholder: This music player does...
    validations:
      required: true 
  - type: textarea
    id: why
    attributes:
      label: Benefit
      description: >
        How will this addition benefit **everyone's** usage of Sonaro? A convincing argument increases the likelihood
        that this feature is accepted.
      placeholder: This feature allows...
    validations:
      required: true 
  - type: checkboxes
    id: terms
    attributes:
      label: Duplicates
      description: By submitting this issue, you aknowledge the following
      options:
        - label: I have checked this feature request for duplicates.
          required: true
        - label: I have checked that this feature is not implemented in the [latest version](https://github.com/shear99/Sonaro/releases).
          required: true
        - label: I agree to the [Contribution Guidelines](https://github.com/shear99/Sonaro/blob/main/.github/CONTRIBUTING.md).
          required: true          
